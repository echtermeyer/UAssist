name: Setup Fresh VM

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
                https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list
              sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin ipset
              sudo usermod -aG docker deploy
            fi

            # Clone repo if not present, otherwise force-reset to match remote
            if [ ! -d /home/deploy/UAssist ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} /home/deploy/UAssist
            else
              cd /home/deploy/UAssist && git fetch origin main && git reset --hard origin/main && git clean -fd
            fi

            cd /home/deploy/UAssist

            REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            cat > .env << EOF
            GITHUB_REPOSITORY=$REPO
            MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
            MONGO_API_PASSWORD=${{ secrets.MONGO_API_PASSWORD }}
            MONGO_URL=mongodb://uassist_api:${{ secrets.MONGO_API_PASSWORD }}@mongodb:27017/?authSource=admin
            MONGO_ADMIN_URL=mongodb://mongoadmin:${{ secrets.MONGO_ROOT_PASSWORD }}@mongodb:27017/?authSource=admin
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            COOKIE_SECURE=false
            TENANT_WORKER_IMAGE=ghcr.io/$REPO/tenant-worker:latest
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_KMS_KEY_ID=${{ secrets.AWS_KMS_KEY_ID }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker pull ghcr.io/$REPO/tenant-worker:latest
            docker compose up -d

            sudo bash /home/deploy/UAssist/scripts/geoip-de.sh
