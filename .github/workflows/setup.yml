name: Setup Fresh VM

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
                https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo usermod -aG docker deploy
            fi

            # Clone repo if not present, otherwise pull
            if [ ! -d /home/deploy/UAssist ]; then
              git clone https://github.com/${{ github.repository }} /home/deploy/UAssist
            else
              cd /home/deploy/UAssist && git pull origin main
            fi

            cd /home/deploy/UAssist

            cat > .env << 'EOF'
            GITHUB_REPOSITORY=${{ github.repository }}
            MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
            MONGO_API_PASSWORD=${{ secrets.MONGO_API_PASSWORD }}
            MONGO_URL=mongodb://uassist_api:${{ secrets.MONGO_API_PASSWORD }}@mongodb:27017/?authSource=admin
            MONGO_ADMIN_URL=mongodb://mongoadmin:${{ secrets.MONGO_ROOT_PASSWORD }}@mongodb:27017/?authSource=admin
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MASTER_ENCRYPTION_KEY=${{ secrets.MASTER_ENCRYPTION_KEY }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            COOKIE_SECURE=false
            TENANT_WORKER_IMAGE=ghcr.io/${{ github.repository }}/tenant-worker:latest
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
