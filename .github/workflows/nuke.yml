name: Nuke VM

on:
  workflow_dispatch:

jobs:
  nuke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            [ -d /home/deploy/UAssist ] && (cd /home/deploy/UAssist && docker compose down -v --remove-orphans) || true
            docker ps -aq --filter "name=uassist-tenant-" | xargs -r docker rm -f
            docker volume ls -q --filter "name=uassist-tenant-" | xargs -r docker volume rm
            pm2 delete all 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
