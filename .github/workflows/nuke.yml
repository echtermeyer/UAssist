name: Nuke VM

on:
  workflow_dispatch:

jobs:
  nuke:
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/UAssist
            docker compose down -v --remove-orphans
            docker ps -aq --filter "name=uassist-tenant-" | xargs -r docker rm -f
            docker volume ls -q --filter "name=uassist-tenant-" | xargs -r docker volume rm
