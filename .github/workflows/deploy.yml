name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name
        id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.repo }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-app
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.repo }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Tenant Worker
        uses: docker/build-push-action@v5
        with:
          context: ./tenant-worker
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.repo }}/tenant-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/deploy/UAssist
            git pull origin main
            REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            cat > .env << EOF
            GITHUB_REPOSITORY=$REPO
            MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
            MONGO_API_PASSWORD=${{ secrets.MONGO_API_PASSWORD }}
            MONGO_URL=mongodb://uassist_api:${{ secrets.MONGO_API_PASSWORD }}@mongodb:27017/?authSource=admin
            MONGO_ADMIN_URL=mongodb://mongoadmin:${{ secrets.MONGO_ROOT_PASSWORD }}@mongodb:27017/?authSource=admin
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MASTER_ENCRYPTION_KEY=${{ secrets.MASTER_ENCRYPTION_KEY }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            COOKIE_SECURE=false
            TENANT_WORKER_IMAGE=ghcr.io/$REPO/tenant-worker:latest
            EOF
            docker compose pull
            docker compose up -d
